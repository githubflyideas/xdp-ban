<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="760" height="440" fill="#eef1f5"/>
<rect width="760" height="40" fill="#0f1b2d"/><text x="16" y="26" font-size="14" font-weight="700" fill="#fff">XDP<tspan fill="#d9411e">-ban</tspan></text>
<text x="30" y="80" font-size="18" font-weight="600" fill="#1a2433">阶梯封禁 · Escalating Ban</text>
<text x="30" y="102" font-size="12" fill="#67748a">攻击者持续尝试 → 封禁时间阶梯式升级,不再一解封就被接着打</text>
<g transform="translate(40,130)">
